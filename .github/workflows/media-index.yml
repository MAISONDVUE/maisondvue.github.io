name: Rebuild media gallery

on:
  push:
    branches: [main]
    paths:
      - 'media/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: media-index
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild media/index.html
        run: python3 .github/scripts/build-media-index.py

      - name: Commit if the listing changed
        run: |
          if git diff --quiet -- media/index.html; then
            echo "Gallery already current, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/index.html
          git commit -m "Rebuild the media gallery"
          git push
