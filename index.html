<style>
  :root{
    --navy:#0B1F3A;
    --navy-deep:#070D22;
    --navy-center:#122749;
    --cobalt:#1A2744;

    --gold:#C9A96E;
    --gold-soft:#D9BE8B;
    --gold-light:#D9BE8B;
    --gold-muted:#B8996A;

    --cream:#F0E6D0;
    --warm-white:#FDFBF8;
    --ivory:#F9F6F0;

    --line:rgba(11,31,58,0.18);
    --mid:#5D6A7E;

    /* Documentary navy tones - bridge to photograph above */
    --navy-charcoal:#0A0F1F;
    --navy-deeper:#04081A;

    --font-display:'Cormorant Garamond','EB Garamond',Garamond,Georgia,serif;
    --font-italic:'EB Garamond',Georgia,serif;
    --font-sans:'Jost','Helvetica Neue',Arial,sans-serif;

    --ribbon-h: 44px;
    --logo-h: 88px;
    --nav-h: 0px;
    --header-total: calc(var(--ribbon-h) + var(--logo-h) + var(--nav-h));
  }

  *,*::before,*::after{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  html,body{
    background:var(--navy-charcoal);
    color:var(--cream);
    font-family:var(--font-sans);
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    min-height:100vh;
  }

  body{
    position:relative;
  }

  /* ═══════════════════════════════════════════════════════════
     PROMO RIBBON — Chanel pattern, dismissible
     ═══════════════════════════════════════════════════════════ */
  .promo-ribbon{
    height:var(--ribbon-h);
    background:var(--navy-charcoal);
    color:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    border-bottom:1px solid rgba(201,169,110,0.15);
    transition:height 360ms ease, opacity 360ms ease;
    overflow:hidden;
  }

  .promo-ribbon.dismissed{
    height:0;
    opacity:0;
    border-bottom:0;
  }

  .promo-ribbon-text{
    font-family:var(--font-display);
    font-size:12px;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:rgba(249,246,240,0.88);
    text-align:center;
    padding:0 60px;
    line-height:1;
    white-space:nowrap;
  }

  .promo-ribbon-text .accent{
    color:var(--gold);
    margin:0 14px;
  }

  .promo-ribbon-close{
    position:absolute;
    right:22px;
    top:50%;
    transform:translateY(-50%);
    background:transparent;
    border:0;
    color:rgba(249,246,240,0.7);
    font-size:18px;
    cursor:pointer;
    line-height:1;
    padding:4px 6px;
    transition:color 240ms ease;
  }

  .promo-ribbon-close:hover{
    color:var(--gold);
  }

  /* ═══════════════════════════════════════════════════════════
     HEADER — centered wordmark with utility icons
     ═══════════════════════════════════════════════════════════ */
  .header-logo-row{
    background:var(--warm-white);
    height:var(--logo-h);
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:1px solid rgba(11,31,58,0.06);
  }

  .header-logo{
    font-family:var(--font-display);
    font-weight:400;
    font-size:clamp(20px,2.4vw,32px);
    letter-spacing:0.42em;
    text-transform:uppercase;
    color:var(--navy);
    line-height:1;
    white-space:nowrap;
    text-decoration:none;
  }

  .header-utility{
    position:absolute;
    right:40px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    gap:22px;
    align-items:center;
  }

  .header-utility-btn{
    background:transparent;
    border:0;
    color:var(--navy);
    cursor:pointer;
    padding:6px;
    line-height:0;
    transition:color 240ms ease;
    text-decoration:none;
  }

  .header-utility-btn:hover{
    color:var(--gold-muted);
  }

  .header-utility-btn svg{
    width:18px;
    height:18px;
    display:block;
  }

  .site-header{
    position:sticky;
    top:0;
    z-index:90;
    transition:transform 360ms ease;
  }

  /* ═══════════════════════════════════════════════════════════
     MAIN — photograph band on top (16:9), reservation below
     The photograph's full scene is preserved at every screen
     size by using aspect-ratio rather than viewport height.
     ═══════════════════════════════════════════════════════════ */
  main{
    position:relative;
    min-height:calc(100vh - var(--header-total));
    overflow:hidden;
    background:var(--navy-charcoal);
  }

  /* PHOTOGRAPH — 16:9 aspect-ratio band at top of page.
     Full scene visible, never cropped. */
  .photograph-pane{
    position:relative;
    width:100%;
    aspect-ratio:16 / 9;
    max-height:680px;
    overflow:hidden;
    background:var(--navy-charcoal);
  }

  .photograph-pane img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
  }

  /* Photograph sits tight to the reservation section below -
     no gradient transition needed */
  .photograph-pane::after{
    display:none;
  }

  .photo-fallback{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }

  .photo-fallback .mark{
    font-family:var(--font-display);
    font-weight:300;
    font-style:italic;
    font-size:clamp(96px,14vw,220px);
    line-height:1;
    color:var(--gold);
    opacity:0.5;
  }

  .photo-fallback .label{
    margin-top:24px;
    font-family:var(--font-display);
    font-weight:500;
    font-size:11px;
    letter-spacing:0.5em;
    text-transform:uppercase;
    color:var(--gold-muted);
    padding-left:0.5em;
  }

  /* RESERVATION PANE — Vogue-style asymmetric caption layout.
     Left: brand text as editorial caption.
     Right: reservation form as credits panel.
     The two columns mirror the photograph's horizontal composition. */
  .reservation-pane{
    position:relative;
    z-index:3;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    width:100%;
    padding:120px 56px 120px;
    background:var(--navy-charcoal);
  }

  .reservation-pane::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:120px;
    background:linear-gradient(180deg,
      rgba(0,0,0,0.55) 0%,
      rgba(4,8,26,0.35) 40%,
      rgba(10,15,31,0) 100%);
    pointer-events:none;
    z-index:1;
  }

  .reservation-frame{
    position:relative;
    width:100%;
    max-width:1200px;
    padding:0;
    text-align:left;
    background:transparent;
    border:0;
    z-index:2;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:120px;
    align-items:start;
  }

  /* Left column - editorial caption */
  .res-caption{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    text-align:left;
  }

  /* Right column - form panel */
  .res-action{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    padding-top:36px;
  }

  /* Gold corner accents hidden since box is removed */
  .reservation-frame::before,
  .reservation-frame::after,
  .res-corner-tr,
  .res-corner-bl{
    display:none;
  }

  /* Limited Edition-style eyebrow - small sans, all-caps */
  .res-eyebrow{
    font-family:var(--font-sans);
    font-weight:400;
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:rgba(240,230,208,0.7);
    margin-top:0;
    margin-bottom:32px;
    line-height:1.4;
  }

  .res-eyebrow .tm{
    font-size:0.7em;
    vertical-align:super;
    letter-spacing:0.05em;
    margin-left:2px;
  }

  /* Modern Garamond headline - upright, light weight, sentence case,
     tight tracking. Clean and elegant without italic ornament.
     Reads as Aesop / The Row / Augustinus Bader register. */
  .res-headline{
    font-family:var(--font-display);
    font-weight:300;
    font-size:clamp(48px,5.4vw,84px);
    line-height:1.0;
    letter-spacing:-0.01em;
    color:var(--cream);
    margin-bottom:32px;
  }

  /* The em element is treated identically - no italic, no gold,
     just continuous Cormorant in the same weight and tone */
  .res-headline em{
    display:inline;
    font-family:var(--font-display);
    font-style:normal;
    font-weight:300;
    color:var(--cream);
    letter-spacing:-0.01em;
  }

  .res-scent{
    font-family:var(--font-sans);
    font-style:normal;
    font-weight:400;
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    line-height:1.7;
    color:rgba(240,230,208,0.55);
    margin:0 0 28px;
    max-width:42ch;
  }

  .res-body{
    font-family:var(--font-sans);
    font-style:normal;
    font-weight:400;
    font-size:14px;
    line-height:1.7;
    letter-spacing:0.005em;
    color:rgba(240,230,208,0.82);
    max-width:46ch;
    margin:0;
  }

  .inline-shop{
    color:var(--cream);
    text-decoration:none;
    border-bottom:1px solid rgba(240,230,208,0.55);
    padding-bottom:1px;
    transition:border-color 280ms ease, color 280ms ease;
  }

  .inline-shop:hover{
    border-bottom-color:var(--cream);
    color:#FFFFFF;
  }

  form.reservation{
    display:flex;
    flex-direction:column;
    gap:12px;
    max-width:100%;
    margin:0;
  }

  form.reservation .field{
    position:relative;
  }

  form.reservation input[type="text"],
  form.reservation input[type="email"]{
    width:100%;
    background:rgba(4,8,26,0.55);
    border:1px solid rgba(240,230,208,0.18);
    color:var(--cream);
    font-family:var(--font-sans);
    font-weight:400;
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    padding:18px 18px;
    outline:none;
    transition:border-color 320ms ease, background 320ms ease;
  }

  form.reservation input::placeholder{
    color:rgba(240,230,208,0.38);
    text-transform:uppercase;
    letter-spacing:0.28em;
    font-weight:400;
  }

  form.reservation input:focus{
    border-color:rgba(240,230,208,0.5);
    background:rgba(4,8,26,0.85);
  }

  form.reservation .hp{
    position:absolute;
    left:-9999px;
    opacity:0;
  }

  form.reservation button{
    margin-top:8px;
    background:var(--cream);
    color:var(--navy-charcoal);
    border:1px solid var(--cream);
    font-family:var(--font-sans);
    font-weight:500;
    letter-spacing:0.28em;
    text-transform:uppercase;
    font-size:11px;
    padding:18px 32px;
    cursor:pointer;
    transition:background 320ms ease, color 320ms ease, border-color 320ms ease;
  }

  form.reservation button:hover{
    background:var(--cream-warm);
    border-color:var(--cream-warm);
  }

  form.reservation button:disabled{
    opacity:0.55;
    cursor:not-allowed;
  }

  .invitation-block{
    margin-top:36px;
    padding-top:28px;
    border-top:1px solid rgba(240,230,208,0.12);
    max-width:100%;
  }

  .invitation-label{
    display:block;
    font-family:var(--font-sans);
    font-weight:400;
    font-size:10px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:rgba(240,230,208,0.5);
    margin-bottom:14px;
    padding-left:0.32em;
  }

  .invitation-form{
    display:flex;
    align-items:stretch;
    gap:0;
    width:100%;
  }

  .invitation-form input{
    flex:1;
    background:rgba(4,8,26,0.55);
    border:1px solid rgba(240,230,208,0.18);
    border-right:0;
    color:var(--cream);
    font-family:var(--font-sans);
    font-weight:400;
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    padding:14px 16px;
    outline:none;
    transition:border-color 320ms ease, background 320ms ease;
  }

  .invitation-form input::placeholder{
    color:rgba(240,230,208,0.38);
    text-transform:uppercase;
    letter-spacing:0.28em;
  }

  .invitation-form input:focus{
    border-color:rgba(240,230,208,0.5);
    background:rgba(4,8,26,0.85);
  }

  .invitation-form button{
    background:var(--cream);
    color:var(--navy-charcoal);
    border:1px solid var(--cream);
    font-family:var(--font-sans);
    font-weight:500;
    font-size:14px;
    padding:14px 22px;
    cursor:pointer;
    transition:background 320ms ease;
  }

  .invitation-form button:hover{
    background:var(--cream-warm);
  }

  .invitation-feedback{
    display:block;
    margin-top:10px;
    min-height:18px;
    font-family:var(--font-sans);
    font-style:normal;
    font-weight:300;
    font-size:12px;
    letter-spacing:0.04em;
    color:rgba(216,180,180,0.9);
  }

  .res-message{
    margin-top:24px;
    padding-top:20px;
    min-height:24px;
    font-family:var(--font-sans);
    font-style:normal;
    font-weight:300;
    font-size:14px;
    letter-spacing:0.04em;
    line-height:1.55;
    border-top:0.5px solid rgba(239,232,214,0.14);
  }

  .res-message.success{ color:var(--cream); }
  .res-message.error{ color:#D8B4B4; }

  .reveal{
    opacity:0;
    transform:translateY(8px);
    transition:opacity 800ms ease, transform 800ms ease;
  }

  .reveal.in{
    opacity:1;
    transform:translateY(0);
  }

  /* ═══════════════════════════════════════════════════════════
     RESPONSIVE
     ═══════════════════════════════════════════════════════════ */
  @media (max-width:960px){
    :root{
      --logo-h:68px;
      --nav-h:0px;
    }

    .promo-ribbon-text{
      font-size:10px;
      letter-spacing:0.22em;
      padding:0 40px;
      white-space:nowrap;
      line-height:1;
    }

    .header-utility{
      right:14px;
      gap:10px;
    }

    .header-utility-btn svg{
      width:15px;
      height:15px;
    }

    .header-utility-btn[aria-label="Contact"]{
      display:none;
    }

    .header-logo{
      font-size:15px;
      letter-spacing:0.28em;
    }

    /* Two-column layout collapses to single column on tablet/mobile */
    .reservation-pane{
      padding:88px 32px 96px;
    }

    .reservation-frame{
      max-width:560px;
      grid-template-columns:1fr;
      gap:48px;
    }

    .res-action{
      padding-top:0;
    }

    .res-headline{
      font-size:56px;
    }
  }

  /* ─── PHONE (under 640px) ─── */
  @media (max-width:640px){
    .reservation-pane{
      padding:64px 24px 80px;
    }

    .reservation-frame{
      max-width:100%;
      gap:36px;
    }

    .res-kicker{
      font-size:10px;
      letter-spacing:0.42em;
      margin-bottom:12px;
    }

    /* Rule stays left-aligned on mobile too */
    .res-mini-rule{
      width:28px;
      margin:0 0 22px;
    }

    .res-eyebrow{
      font-size:10px;
      letter-spacing:0.32em;
      margin-bottom:22px;
    }

    .res-headline{
      font-size:44px;
      margin-bottom:22px;
      line-height:1.0;
    }

    .res-body{
      font-size:14px;
      line-height:1.7;
      margin:0;
    }

    .res-scent{
      font-size:10px;
      letter-spacing:0.28em;
      margin-bottom:22px;
    }

    form.reservation{
      gap:10px;
    }

    form.reservation input[type="text"],
    form.reservation input[type="email"]{
      padding:14px 14px;
      font-size:10px;
      letter-spacing:0.24em;
    }

    form.reservation input::placeholder{
      letter-spacing:0.24em;
    }

    form.reservation button{
      padding:15px 16px;
      font-size:10px;
      letter-spacing:0.28em;
    }

    .invitation-block{
      margin-top:28px;
      padding-top:24px;
    }

    .invitation-label{
      font-size:9px;
      letter-spacing:0.28em;
      margin-bottom:12px;
    }

    .invitation-form input{
      padding:11px 12px;
      font-size:10px;
      letter-spacing:0.24em;
    }

    .invitation-form button{
      padding:11px 14px;
      font-size:13px;
    }

    .invitation-feedback{
      font-size:12px;
    }

    .res-message{
      margin-top:20px;
      padding-top:18px;
      font-size:14px;
    }
  }

  @media (max-width:380px){
    .reservation-pane{
      padding:48px 18px 64px;
    }

    .reservation-frame{
      max-width:100%;
    }

    .res-headline{
      font-size:36px;
    }
  }
</style>
</head>
<body>

<!-- ═══ PROMO RIBBON ═══ -->
<div class="promo-ribbon" id="promoRibbon">
  <p class="promo-ribbon-text">
    Complimentary shipping on every Allocation
  </p>
  <button class="promo-ribbon-close" type="button" aria-label="Dismiss" onclick="dismissPromoRibbon()">&times;</button>
</div>

<!-- ═══ STICKY HEADER ═══ -->
<header class="site-header">

  <!-- Logo row -->
  <div class="header-logo-row">

    <a href="/" class="header-logo">MAISON D&rsquo;VUE</a>

    <div class="header-utility">
      <button class="header-utility-btn" type="button" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
          <circle cx="11" cy="11" r="7"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21"/>
        </svg>
      </button>
      <a href="mailto:hello@maisondvue.com" class="header-utility-btn" aria-label="Contact">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
        </svg>
      </a>
      <a href="https://shop.maisondvue.com/cart" class="header-utility-btn" aria-label="Bag">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
          <path d="M6 7h12l-1 14H7L6 7z"/>
          <path d="M9 7V5a3 3 0 0 1 6 0v2"/>
        </svg>
      </a>
    </div>
  </div>

  <!-- Nav row removed - homepage is gated by invitation code -->

</header>

<!-- Mobile menu removed - homepage has no nav -->

<!-- ═══ MAIN — photo band then reservation ═══ -->
<main id="reserve">

  <aside class="photograph-pane reveal" aria-hidden="true">
    <img src="paparazzi-elixir.jpg"
         alt=""
         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
    <div class="photo-fallback">
      <div class="mark">XIV</div>
      <div class="label">Essences</div>
    </div>
  </aside>

  <section class="reservation-pane">
    <div class="reservation-frame reveal">

      <!-- LEFT COLUMN: Editorial caption -->
      <div class="res-caption">
        <p class="res-eyebrow">The House of Affinity Compositions<span class="tm">&trade;</span></p>

        <h1 class="res-headline">The Hair Elixir</h1>

        <p class="res-scent">Fourteen rare essences &middot; Scented in &Acirc;me de Vue&trade;</p>

        <p class="res-body">
          Composed in Beverly Hills. Reserved by request. The June allocation opens to the list first.
        </p>
      </div>

      <!-- RIGHT COLUMN: Reservation form -->
      <div class="res-action">
        <form id="reservationForm" class="reservation" novalidate>
          <div class="field">
            <input type="text" id="firstName" name="firstName" autocomplete="given-name" placeholder="First name">
          </div>
          <div class="field">
            <input type="email" id="email" name="email" autocomplete="email" required placeholder="Email address">
          </div>
          <div class="hp" aria-hidden="true">
            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
          </div>
          <button type="submit" id="submitBtn">Reserve your elixir</button>
        </form>

        <div class="invitation-block">
          <label for="invitationCode" class="invitation-label">Enter your invitation code</label>
          <form id="invitationForm" class="invitation-form" novalidate>
            <input type="text" id="invitationCode" name="invitationCode" placeholder="Invitation code" autocomplete="off" autocapitalize="characters" spellcheck="false">
            <button type="submit" aria-label="Submit invitation code">&rarr;</button>
          </form>
          <span class="invitation-feedback" id="invitationFeedback" role="status" aria-live="polite"></span>
        </div>

        <div class="res-message" id="message" role="status" aria-live="polite"></div>
      </div>

    </div>
  </section>

</main>

<script>
  const WAITLIST_ENDPOINT = "https://script.google.com/macros/s/AKfycbxFDan6t6d4vsBxdwGNIoh4JDzSyBcQQqubU2JpOV--v_P-NXH3h9-1fWPFnc5EWZCKiA/exec";
  const PRODUCT_URL = "/product.html";
  const INVITATION_CODE = "WELCOME26";
  const INVITATION_REDIRECT = PRODUCT_URL;

  document.querySelectorAll('.reveal').forEach(function(el, i){
    setTimeout(function(){ el.classList.add('in'); }, 120 + i * 220);
  });

  /* ─── PROMO RIBBON DISMISS ─── */
  function dismissPromoRibbon(){
    var ribbon = document.getElementById('promoRibbon');
    ribbon.classList.add('dismissed');
    setRibbonCookie('mdv_ribbon_dismissed', '1', 30);
  }

  function setRibbonCookie(name, value, days){
    var d = new Date();
    d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
    document.cookie = name + '=' + value + ';expires=' + d.toUTCString() + ';path=/;SameSite=Lax';
  }

  function getRibbonCookie(name){
    var value = '; ' + document.cookie;
    var parts = value.split('; ' + name + '=');
    if (parts.length === 2) return parts.pop().split(';').shift();
    return null;
  }

  if (getRibbonCookie('mdv_ribbon_dismissed')){
    document.getElementById('promoRibbon').classList.add('dismissed');
  }

  /* ─── RESERVATION FORM ─── */
  var form = document.getElementById('reservationForm');
  var btn = document.getElementById('submitBtn');
  var msg = document.getElementById('message');
  var emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function setMsg(text, type){
    msg.textContent = text || '';
    msg.classList.remove('success','error');
    if (type) msg.classList.add(type);
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    setMsg('');
    var email = form.email.value.trim();
    var firstName = form.firstName.value.trim();
    var honey = form.website.value.trim();

    if (honey){
      setMsg('Your reservation has been received.', 'success');
      form.reset();
      return;
    }

    if (!emailRe.test(email)){
      setMsg('A complete email, please.', 'error');
      form.email.focus();
      return;
    }

    if (WAITLIST_ENDPOINT.indexOf('REPLACE_') === 0){
      setMsg('The reservation list is not yet wired. Paste your Apps Script URL into WAITLIST_ENDPOINT.', 'error');
      return;
    }

    btn.disabled = true;
    var origLabel = btn.textContent;
    btn.textContent = 'Reserving...';

    try {
      var fd = new FormData();
      fd.append('email', email);
      fd.append('firstName', firstName);
      fd.append('source', 'homepage-reservation');
      fd.append('userAgent', navigator.userAgent || '');
      fd.append('referrer', document.referrer || '');

      var res = await fetch(WAITLIST_ENDPOINT, { method:'POST', body:fd });
      var ok = res.ok;
      try {
        var data = await res.json();
        ok = ok && data && data.ok !== false;
      } catch(_){}

      if (ok){
        setMsg('Your reservation has been received. A letter will follow.', 'success');
        form.reset();
      } else {
        throw new Error('Server returned an error');
      }
    } catch(err){
      setMsg('Forgive us — something faltered in transit. Write to hello@maisondvue.com.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = origLabel;
    }
  });

  /* ─── INVITATION CODE ─── */
  var invForm = document.getElementById('invitationForm');
  var invInput = document.getElementById('invitationCode');
  var invFeedback = document.getElementById('invitationFeedback');

  invForm.addEventListener('submit', function(e){
    e.preventDefault();
    invFeedback.textContent = '';
    var entered = (invInput.value || '').trim().toUpperCase();

    if (!entered){
      invFeedback.textContent = 'A code, please.';
      invInput.focus();
      return;
    }

    if (entered === INVITATION_CODE){
      window.location.href = INVITATION_REDIRECT;
    } else {
      invFeedback.textContent = 'This code is not recognized.';
      invInput.select();
    }
  });
</script>

</body>
</html>
