<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>Maison D'Vue — Hair Elixir</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #040914;
      --gold: #b89a68;
      --gold-soft: rgba(184, 154, 104, 0.45);
      --gold-faint: rgba(184, 154, 104, 0.22);
      --ivory: #efe6d4;
      --ivory-soft: #d7ccb7;
      --muted: #8b7a61;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
    }

    body {
      font-family: "Montserrat", sans-serif;
      color: var(--ivory);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 22%;
      opacity: 0.7;
      filter: contrast(1.55) brightness(1.2) saturate(1.12);
      z-index: -3;
      pointer-events: none;
      background: var(--bg);
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 9, 20, 0.24);
      z-index: -2;
      pointer-events: none;
    }

    .bg-overlay::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          circle at center,
          rgba(4, 9, 20, 0.02) 0%,
          rgba(4, 9, 20, 0.14) 56%,
          rgba(4, 9, 20, 0.48) 100%
        );
    }

    .corner {
      position: fixed;
      width: 22px;
      height: 22px;
      opacity: 0.5;
      z-index: 3;
      pointer-events: none;
    }

    .tl {
      top: 18px;
      left: 18px;
      border-top: 1px solid var(--gold-soft);
      border-left: 1px solid var(--gold-soft);
    }

    .tr {
      top: 18px;
      right: 18px;
      border-top: 1px solid var(--gold-soft);
      border-right: 1px solid var(--gold-soft);
    }

    .bl {
      bottom: 18px;
      left: 18px;
      border-bottom: 1px solid var(--gold-soft);
      border-left: 1px solid var(--gold-soft);
    }

    .br {
      bottom: 18px;
      right: 18px;
      border-bottom: 1px solid var(--gold-soft);
      border-right: 1px solid var(--gold-soft);
    }

    .wrap {
      width: min(84vw, 520px);
      text-align: center;
      position: relative;
      z-index: 5;
      padding: 1rem 0 2rem;
    }

    .eyebrow {
      font-size: 8px;
      letter-spacing: 0.34em;
      color: var(--gold);
      margin-bottom: 1.55rem;
    }

    h1 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 300;
      font-size: 34px;
      line-height: 1;
      letter-spacing: 0.1em;
      color: var(--ivory);
    }

    .sub {
      font-size: 8px;
      letter-spacing: 0.32em;
      color: var(--gold);
      margin: 0.65rem 0 2.2rem;
    }

    .divider {
      width: 50px;
      height: 1px;
      background: var(--gold-soft);
      margin: 0 auto 2.2rem;
    }

    .headline {
      font-size: 9px;
      letter-spacing: 0.3em;
      color: var(--gold);
      margin-bottom: 0.95rem;
    }

    .body-text {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 17px;
      color: var(--ivory);
      margin-bottom: 2.2rem;
    }

    .form-block {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
    }

    input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--gold);
      color: var(--ivory);
      text-align: center;
      padding: 14px 0 13px;
      letter-spacing: 0.18em;
      outline: none;
      font-family: "Montserrat", sans-serif;
      font-size: 11px;
    }

    input::placeholder {
      color: var(--gold);
      opacity: 0.82;
    }

    .btn {
      width: 78%;
      margin-top: 1.45rem;
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      padding: 15px 20px;
      letter-spacing: 0.34em;
      font-family: "Montserrat", sans-serif;
      font-size: 10px;
      cursor: pointer;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .btn:hover {
      background: var(--gold);
      color: var(--bg);
    }

    .request-link {
      display: inline-block;
      margin-top: 1.85rem;
      font-size: 9px;
      letter-spacing: 0.28em;
      color: var(--gold);
      border-bottom: 1px solid var(--gold-soft);
      padding-bottom: 6px;
      cursor: pointer;
      transition: color 0.25s ease, border-color 0.25s ease;
    }

    .request-link:hover {
      color: var(--ivory);
      border-color: var(--gold);
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .success-text {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 20px;
      color: var(--ivory-soft);
    }

    @media (min-width: 769px) {
      .bg-video {
        object-position: 50% 26%;
        opacity: 0.46;
        filter: contrast(1.35) brightness(1.08) saturate(1.08);
      }

      .bg-overlay {
        background: rgba(4, 9, 20, 0.42);
      }

      .wrap {
        width: min(92vw, 640px);
        padding: 2rem 0;
      }

      .eyebrow {
        font-size: 10px;
        letter-spacing: 0.42em;
        margin-bottom: 2rem;
      }

      h1 {
        font-size: 46px;
        letter-spacing: 0.12em;
      }

      .sub {
        font-size: 9px;
        margin: 0.55rem 0 2.45rem;
      }

      .divider {
        margin-bottom: 2.45rem;
      }

      .headline {
        font-size: 10px;
        letter-spacing: 0.35em;
        margin-bottom: 1rem;
      }

      .body-text {
        font-size: 20px;
        margin-bottom: 2.35rem;
      }

      .form-block {
        max-width: 500px;
      }

      input {
        font-size: 12px;
        padding: 12px 0;
      }

      .btn {
        width: auto;
        min-width: 230px;
        font-size: 10px;
        padding: 15px 40px;
        margin-top: 1.6rem;
      }

      .request-link {
        font-size: 10px;
        letter-spacing: 0.35em;
        margin-top: 2rem;
      }
    }
  </style>
</head>
<body>
  <video
    class="bg-video"
    id="bgVideo"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline="true"
    preload="auto"
    disablepictureinpicture
  >
    <source src="oildrop.mp4" type="video/mp4" />
  </video>

  <div class="bg-overlay"></div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="wrap">
    <div class="eyebrow">Maison D'Vue</div>
    <h1>HAIR ELIXIR</h1>
    <div class="sub">30 ml</div>
    <div class="divider"></div>

    <div class="screen active" id="screen-password">
      <div class="headline">Private access</div>
      <div class="body-text">Enter your code to continue.</div>

      <div class="form-block">
        <input id="code" placeholder="Enter your code" />
      </div>

      <button class="btn" onclick="check()">Enter</button>

      <div class="request-link" onclick="show('screen-request')">
        Request an invitation
      </div>
    </div>

    <div class="screen" id="screen-request">
      <div class="headline">Request an invitation</div>
      <div class="body-text">Leave your details for consideration.</div>

      <div class="form-block">
        <input placeholder="Your name" />
        <br /><br />
        <input placeholder="Your email" />
      </div>

      <button class="btn">Submit</button>
    </div>

    <div class="screen" id="screen-success">
      <div class="success-text">Your request has been received.</div>
    </div>
  </div>

  <script>
    function show(id) {
      document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    function check() {
      if (document.getElementById("code").value === "WELCOME26") {
        show("screen-success");
      }
    }

    const video = document.getElementById("bgVideo");

    async function tryPlayVideo() {
      if (!video) return;
      try {
        video.muted = true;
        video.defaultMuted = true;
        video.setAttribute("muted", "");
        video.setAttribute("playsinline", "");
        await video.play();
      } catch (e) {}
    }

    document.addEventListener("DOMContentLoaded", () => {
      tryPlayVideo();
      setTimeout(tryPlayVideo, 400);
      setTimeout(tryPlayVideo, 1200);
    });

    window.addEventListener("load", tryPlayVideo);

    const firstInteractionPlay = () => {
      if (video && video.paused) {
        tryPlayVideo();
      }
    };

    document.addEventListener("touchstart", firstInteractionPlay, { passive: true });
    document.addEventListener("click", firstInteractionPlay);
  </script>
</body>
</html>
