<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Maison D'Vue — Hair Elixir</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #040914;
      --gold: #c4a97a;
      --gold-mid: rgba(196, 169, 122, 0.52);
      --gold-faint: rgba(196, 169, 122, 0.18);
      --ivory: #f0e8d8;
      --ivory-soft: #cfc4ad;
      --muted: #8b7a61;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--bg);
    }

    body {
      font-family: "Montserrat", sans-serif;
      color: var(--ivory);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: none;
    }

    /* ── Custom cursor ── */
    .cursor {
      position: fixed;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      opacity: 0.65;
      transition: opacity 0.3s ease;
    }

    /* ── Film grain ── */
    .grain {
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      z-index: 2;
      pointer-events: none;
      opacity: 0.028;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 180px 180px;
      animation: grain 9s steps(1) infinite;
    }

    @keyframes grain {
      0%   { transform: translate(0,    0);   }
      11%  { transform: translate(-2%,  3%);  }
      22%  { transform: translate(3%,  -1%);  }
      33%  { transform: translate(-1%, -4%);  }
      44%  { transform: translate(4%,   2%);  }
      55%  { transform: translate(-3%,  1%);  }
      66%  { transform: translate(2%,  -3%);  }
      77%  { transform: translate(-4%,  4%);  }
      88%  { transform: translate(1%,  -2%);  }
      100% { transform: translate(0,    0);   }
    }

    /* ── Video panel — mobile: full screen ── */
    .video-panel {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .bg-video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      opacity: 0.55;
      filter: contrast(1.45) brightness(1.15) saturate(1.1);
    }

    .video-edge-fade {
      display: none;
    }

    /* ── Overlay ── */
    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 85% at 50% 50%, transparent 0%, rgba(4, 9, 20, 0.2) 50%, rgba(4, 9, 20, 0.72) 100%),
        linear-gradient(to bottom, rgba(4, 9, 20, 0.45) 0%, rgba(4, 9, 20, 0.05) 30%, rgba(4, 9, 20, 0.05) 70%, rgba(4, 9, 20, 0.5) 100%);
    }

    /* ── Corner marks ── */
    .corner {
      position: fixed;
      width: 24px;
      height: 24px;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      animation: corner-in 2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }

    @keyframes corner-in {
      to { opacity: 0.4; }
    }

    .tl { top: 20px; left: 20px;     border-top: 1px solid var(--gold-mid); border-left:  1px solid var(--gold-mid); }
    .tr { top: 20px; right: 20px;    border-top: 1px solid var(--gold-mid); border-right: 1px solid var(--gold-mid); }
    .bl { bottom: 20px; left: 20px;  border-bottom: 1px solid var(--gold-mid); border-left:  1px solid var(--gold-mid); }
    .br { bottom: 20px; right: 20px; border-bottom: 1px solid var(--gold-mid); border-right: 1px solid var(--gold-mid); }

    /* ── Content wrap ── */
    .wrap {
      width: min(88vw, 480px);
      text-align: center;
      position: relative;
      z-index: 5;
      padding: 1rem 0 2rem;
    }

    /* ── Staggered entrance ── */
    .reveal {
      opacity: 0;
      transform: translateY(12px);
      animation: fade-up 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fade-up {
      to { opacity: 1; transform: translateY(0); }
    }

    .r1 { animation-delay: 0.15s; }
    .r2 { animation-delay: 0.4s;  }
    .r3 { animation-delay: 0.65s; }
    .r4 { animation-delay: 1.05s; }
    .r5 { animation-delay: 1.25s; }
    .r6 { animation-delay: 1.45s; }

    /* ── Typography ── */
    .eyebrow {
      font-size: 8.5px;
      letter-spacing: 0.44em;
      color: var(--gold);
      margin-bottom: 1.6rem;
      text-transform: uppercase;
    }

    h1 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 300;
      font-size: 36px;
      line-height: 1;
      letter-spacing: 0.12em;
      color: var(--ivory);
    }

    .sub {
      font-size: 8px;
      letter-spacing: 0.38em;
      color: var(--gold);
      margin: 0.7rem 0 2.4rem;
      opacity: 0.78;
    }

    /* ── Animated divider ── */
    .divider {
      height: 1px;
      width: 0;
      background: linear-gradient(to right, transparent, var(--gold-mid), transparent);
      margin: 0 auto 2.4rem;
      animation: divider-grow 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
    }

    @keyframes divider-grow {
      to { width: 58px; }
    }

    /* ── Screen system ── */
    .screen {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1);
      position: absolute;
      left: 0; right: 0;
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
      position: relative;
    }

    .headline {
      font-size: 9px;
      letter-spacing: 0.38em;
      color: var(--gold);
      margin-bottom: 1rem;
      text-transform: uppercase;
    }

    .body-text {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 18px;
      color: var(--ivory);
      line-height: 1.55;
      margin-bottom: 2.4rem;
      opacity: 0.88;
    }

    /* ── Form ── */
    .form-block {
      width: 100%;
    }

    .field-wrap {
      position: relative;
      margin-bottom: 1.6rem;
    }

    input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--gold-faint);
      color: var(--ivory);
      text-align: center;
      padding: 14px 0 13px;
      letter-spacing: 0.22em;
      outline: none;
      font-family: "Montserrat", sans-serif;
      font-size: 11px;
      cursor: none;
    }

    input::placeholder {
      color: var(--gold);
      opacity: 0.55;
      letter-spacing: 0.26em;
    }

    .field-line {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 1px;
      background: var(--gold);
      transition: width 0.55s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    input:focus ~ .field-line {
      width: 100%;
    }

    /* ── Error / nudge ── */
    .error-msg {
      font-size: 7.5px;
      letter-spacing: 0.24em;
      color: rgba(196, 169, 122, 0.6);
      margin-top: 0.7rem;
      opacity: 0;
      transition: opacity 0.45s ease;
      text-transform: uppercase;
      line-height: 1.9;
    }

    .error-msg.visible {
      opacity: 1;
    }

    .error-invite {
      display: inline-block;
      margin-top: 0.25rem;
      font-size: 7.5px;
      letter-spacing: 0.24em;
      color: var(--gold);
      border-bottom: 1px solid var(--gold-faint);
      padding-bottom: 2px;
      cursor: none;
      text-transform: uppercase;
      transition: color 0.35s ease, border-color 0.35s ease;
    }

    .error-invite:hover {
      color: var(--ivory-soft);
      border-color: var(--gold-mid);
    }

    /* ── Button ── */
    .btn {
      display: inline-block;
      min-width: 200px;
      margin-top: 1.6rem;
      border: 1px solid var(--gold-mid);
      background: transparent;
      color: var(--gold);
      padding: 15px 40px;
      letter-spacing: 0.4em;
      font-family: "Montserrat", sans-serif;
      font-size: 9px;
      text-transform: uppercase;
      cursor: none;
      transition:
        background 0.5s cubic-bezier(0.16, 1, 0.3, 1),
        color      0.5s cubic-bezier(0.16, 1, 0.3, 1),
        border-color 0.5s ease,
        box-shadow   0.5s ease;
    }

    .btn:hover {
      background: var(--gold);
      color: var(--bg);
      border-color: var(--gold);
      box-shadow: 0 0 32px rgba(196, 169, 122, 0.16);
    }

    /* ── Request link ── */
    .request-link {
      display: inline-block;
      margin-top: 2rem;
      font-size: 8.5px;
      letter-spacing: 0.3em;
      color: var(--muted);
      border-bottom: 1px solid rgba(139, 122, 97, 0.3);
      padding-bottom: 5px;
      cursor: none;
      text-transform: uppercase;
      transition: color 0.4s ease, border-color 0.4s ease;
    }

    .request-link:hover {
      color: var(--ivory-soft);
      border-color: var(--gold-mid);
    }

    /* ── Success ── */
    .success-wrap { padding: 0.5rem 0; }

    .success-eyebrow {
      font-size: 8px;
      letter-spacing: 0.44em;
      color: var(--gold);
      margin-bottom: 1.4rem;
      text-transform: uppercase;
      opacity: 0.75;
    }

    .success-text {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 21px;
      color: var(--ivory);
      line-height: 1.65;
      opacity: 0.9;
    }

    .success-rule {
      width: 28px;
      height: 1px;
      background: var(--gold-mid);
      margin: 1.8rem auto 0;
    }

    /* ════════════════════════════════
       DESKTOP
    ════════════════════════════════ */
    @media (min-width: 769px) {

      /* Content stays centered on the full page */
      .wrap {
        width: min(92vw, 560px);
        padding: 2rem 0;
      }

      /* Video panel: right 50% — video positioned so
         its center aligns with the panel's left edge,
         showing only the right half of the drop */
      .video-panel {
        inset: unset;
        top: 0; right: 0;
        width: 50%;
        height: 100%;
      }

      .bg-video {
        position: absolute;
        top: 0;
        left: -50%;      /* drop sits at 75% across — right quarter */
        width: 200%;
        height: 100%;
        object-fit: cover;
        object-position: center 22%;  /* tip of drop as focal point */
        opacity: 0.82;
        filter: contrast(1.38) brightness(1.12) saturate(1.08);
      }

      /* Soft bleed at the split line */
      .video-edge-fade {
        display: block;
        position: absolute;
        top: 0; left: 0;
        width: 160px;
        height: 100%;
        background: linear-gradient(to right, var(--bg) 0%, transparent 100%);
        z-index: 1;
        pointer-events: none;
      }

      /* Lighter overlay on desktop — video does the work */
      .bg-overlay {
        background:
          linear-gradient(to right, rgba(4, 9, 20, 0.85) 0%, rgba(4, 9, 20, 0.4) 45%, transparent 65%),
          linear-gradient(to bottom, rgba(4, 9, 20, 0.3) 0%, transparent 20%, transparent 80%, rgba(4, 9, 20, 0.3) 100%);
      }

      .eyebrow {
        font-size: 10px;
        letter-spacing: 0.5em;
        margin-bottom: 2rem;
      }

      h1 {
        font-size: 52px;
        letter-spacing: 0.14em;
      }

      .sub {
        font-size: 9px;
        margin: 0.6rem 0 2.6rem;
      }

      .headline {
        font-size: 10px;
        letter-spacing: 0.44em;
        margin-bottom: 1.1rem;
      }

      .body-text {
        font-size: 21px;
        margin-bottom: 2.5rem;
      }

      .form-block {
        max-width: 400px;
        margin: 0 auto;
      }

      input {
        font-size: 11px;
        padding: 14px 0;
      }

      .btn {
        min-width: 240px;
        font-size: 10px;
        padding: 16px 52px;
        margin-top: 1.8rem;
      }

      .request-link {
        font-size: 9px;
        letter-spacing: 0.36em;
        margin-top: 2.2rem;
      }

      .success-text { font-size: 24px; }
    }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="grain"></div>

  <!-- Video panel -->
  <div class="video-panel">
    <div class="video-edge-fade"></div>
    <video
      class="bg-video"
      id="bgVideo"
      autoplay muted loop playsinline
      webkit-playsinline="true"
      preload="auto"
      disablepictureinpicture
    >
      <source src="oildrop.mp4" type="video/mp4" />
    </video>
  </div>

  <div class="bg-overlay"></div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="wrap">
    <div class="eyebrow reveal r1">Maison D'Vue</div>
    <h1 class="reveal r2">HAIR ELIXIR</h1>
    <div class="sub reveal r3">30 ml</div>
    <div class="divider"></div>

    <!-- Password screen -->
    <div class="screen active" id="screen-password">
      <div class="headline reveal r4">Private access</div>
      <div class="body-text reveal r5">Enter your code.</div>
      <div class="form-block reveal r6">
        <div class="field-wrap">
          <input id="code" placeholder="Enter your code" autocomplete="off" spellcheck="false" />
          <div class="field-line"></div>
        </div>
        <div class="error-msg" id="error-msg">
          That code isn't recognised.<br>
          <span class="error-invite" onclick="show('screen-request')">Request an invitation</span>
        </div>
      </div>
      <button class="btn" onclick="check()">Enter</button>
      <br />
      <span class="request-link" onclick="show('screen-request')">Request an invitation</span>
    </div>

    <!-- Request screen -->
    <div class="screen" id="screen-request">
      <div class="headline">Seek an invitation</div>
      <div class="body-text">Leave your details for consideration.</div>
      <div class="form-block">
        <div class="field-wrap">
          <input id="req-name" placeholder="Your name" autocomplete="off" />
          <div class="field-line"></div>
        </div>
        <div class="field-wrap">
          <input id="req-email" placeholder="Your email" type="email" autocomplete="off" />
          <div class="field-line"></div>
        </div>
      </div>
      <button class="btn" onclick="submitRequest()">Submit</button>
      <br />
      <span class="request-link" onclick="show('screen-password')">Return</span>
    </div>

    <!-- Success screen -->
    <div class="screen" id="screen-success">
      <div class="success-wrap">
        <div class="success-eyebrow">Thank you</div>
        <div class="success-text">
          Your request has been received.<br>We will be in touch.
        </div>
        <div class="success-rule"></div>
      </div>
    </div>
  </div>

  <script>
    // Custom cursor
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top  = e.clientY  + 'px';
    });
    document.addEventListener('mouseleave', () => cursor.style.opacity = '0');
    document.addEventListener('mouseenter', () => cursor.style.opacity = '0.65');

    // Screen transitions
    function show(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      requestAnimationFrame(() => requestAnimationFrame(() => {
        document.getElementById(id).classList.add('active');
      }));
    }

    // Password check
    function check() {
      const val = document.getElementById('code').value.trim().toUpperCase();
      const err = document.getElementById('error-msg');
      if (val === 'WELCOME26') {
        err.classList.remove('visible');
        window.location.href = 'https://maisondvue.github.io/product.html';
      } else {
        err.classList.add('visible');
        document.getElementById('code').value = '';
      }
    }

    // Request submission
    function submitRequest() {
      const name  = document.getElementById('req-name').value.trim();
      const email = document.getElementById('req-email').value.trim();
      if (name && email) show('screen-success');
    }

    // Enter key
    document.getElementById('code').addEventListener('keydown', e => {
      if (e.key === 'Enter') check();
    });

    // Video playback
    const video = document.getElementById('bgVideo');
    async function tryPlayVideo() {
      if (!video) return;
      try {
        video.muted = true;
        video.defaultMuted = true;
        video.setAttribute('muted', '');
        video.setAttribute('playsinline', '');
        await video.play();
      } catch(e) {}
    }
    document.addEventListener('DOMContentLoaded', () => {
      tryPlayVideo();
      setTimeout(tryPlayVideo, 400);
      setTimeout(tryPlayVideo, 1200);
    });
    window.addEventListener('load', tryPlayVideo);
    const firstPlay = () => { if (video?.paused) tryPlayVideo(); };
    document.addEventListener('touchstart', firstPlay, { passive: true });
    document.addEventListener('click', firstPlay);
  </script>
</body>
</html>
