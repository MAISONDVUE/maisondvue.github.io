<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maison D'Vue — Hair Elixir</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;400&display=swap" rel="stylesheet" />

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0a0e1a;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3rem 2rem;
  position: relative;
  animation: fadeIn 1.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Floating serif */
.floating-type {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  gap: 0.15em;
  pointer-events: none;
  z-index: 0;
  opacity: 0.06;
  animation: fadeFloatIn 2.5s ease forwards;
}

.floating-type span {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(60px, 10vw, 140px);
  font-weight: 300;
  color: #f0e6d0;
  animation: floatLuxury 8s ease-in-out infinite;
}

.floating-type span:nth-child(1){animation-delay:0s;}
.floating-type span:nth-child(2){animation-delay:.8s;}
.floating-type span:nth-child(3){animation-delay:1.6s;}
.floating-type span:nth-child(4){animation-delay:2.4s;}
.floating-type span:nth-child(5){animation-delay:3.2s;}
.floating-type span:nth-child(6){animation-delay:4s;}

@keyframes floatLuxury {
  0% { transform: translateY(0); }
  50% { transform: translateY(-14px); }
  100% { transform: translateY(0); }
}

@keyframes fadeFloatIn {
  from { opacity: 0; transform: translate(-50%, -40%); }
  to { opacity: 0.06; transform: translate(-50%, -50%); }
}

/* Content above animation */
body > *:not(.floating-type) {
  position: relative;
  z-index: 1;
}

/* Typography */
h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 38px;
  color: #f0e6d0;
  letter-spacing: 0.18em;
  margin-bottom: .3rem;
}

.body-text {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  color: #c8bfa8;
  text-align: center;
  max-width: 420px;
  margin-bottom: 3rem;
  letter-spacing: .02em;
}

/* Inputs */
input {
  background: transparent;
  border: none;
  border-bottom: 1px solid #c9a96e;
  color: #f0e6d0;
  text-align: center;
  padding: 10px 0;
  width: 100%;
}

input:focus {
  border-bottom: 1px solid #f0e6d0;
  box-shadow: 0 6px 12px -8px rgba(201,169,110,0.4);
  outline: none;
}

/* Buttons */
.btn {
  background: transparent;
  border: 1px solid #c9a96e;
  color: #c9a96e;
  padding: 14px 40px;
  cursor: pointer;
  transition: all .3s;
  position: relative;
  overflow: hidden;
}

.btn::after {
  content:"";
  position:absolute;
  inset:0;
  background:#c9a96e;
  opacity:0;
  transition:.3s;
}

.btn:hover::after { opacity:.08; }

.btn:hover { color:#0a0e1a; background:#c9a96e; }

/* Screens */
.screen { display:none; flex-direction:column; align-items:center; }
.screen.active { display:flex; }

/* Popup */
#popup-overlay {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(10,14,26,.92);
  align-items:center;
  justify-content:center;
}

#popup-overlay.open { display:flex; }

/* Minimal styling kept for clarity */
</style>
</head>

<body>

<!-- Floating background -->
<div class="floating-type">
  <span>M</span><span>A</span><span>I</span>
  <span>S</span><span>O</span><span>N</span>
</div>

<h1>HAIR ELIXIR</h1>

<!-- Screen -->
<div class="screen active" id="screen-password">
  <p class="body-text">Enter your access code</p>
  <input type="password" id="inp-code" placeholder="Access code">
  <p id="code-error"></p>
  <button class="btn" onclick="checkCode()">Enter</button>
</div>

<div class="screen" id="screen-welcome">
  <p class="body-text">Welcome. You have been granted access.</p>
</div>

<!-- Popup -->
<div id="popup-overlay">
  <div>
    <input id="popup-email" placeholder="Email">
    <button class="btn" onclick="handlePopupSubmit()">Claim</button>
    <p id="popup-error"></p>
  </div>
</div>

<script>
const ACCESS_CODE = 'WELCOME26';
const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function checkCode(){
  const val = document.getElementById('inp-code').value.trim().toUpperCase();

  if(val === ACCESS_CODE){
    show('screen-welcome');
    setTimeout(openPopup,1200);
  } else {
    document.getElementById('code-error').textContent='Invalid code';
  }
}

function openPopup(){
  document.getElementById('popup-overlay').classList.add('open');
}

async function handlePopupSubmit(){
  const email = document.getElementById('popup-email').value.trim();

  if(!emailRegex.test(email)){
    document.getElementById('popup-error').textContent='Enter valid email';
    return;
  }

  document.getElementById('popup-error').textContent='Thank you.';
}

document.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    checkCode();
  }
});
</script>

</body>
</html>
