<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maison D'Vue — Hair Elixir</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />

<style>
:root {
  --bg: #070d1a;
  --gold: #b89a68;
  --gold-soft: rgba(184,154,104,0.45);
  --gold-faint: rgba(184,154,104,0.2);
  --ivory: #efe6d4;
  --ivory-soft: #d7ccb7;
  --muted: #8b7a61;
}

/* RESET */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: 'Montserrat', sans-serif;
}

/* VIDEO BACKGROUND */
.bg-video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 35%;
  opacity: 0.24;
  filter: contrast(1.18) brightness(0.85) saturate(1.05);
  z-index: -2;
}

.bg-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  opacity: 0.78;
  z-index: -1;
}

.bg-overlay::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(
    circle at center,
    rgba(7,13,26,0) 0%,
    rgba(7,13,26,0.3) 60%,
    rgba(7,13,26,0.65) 100%
  );
}

/* CORNERS */
.corner {
  position: absolute;
  width: 22px;
  height: 22px;
  opacity: 0.5;
}

.tl { top: 18px; left: 18px; border-top: 1px solid var(--gold-soft); border-left: 1px solid var(--gold-soft); }
.tr { top: 18px; right: 18px; border-top: 1px solid var(--gold-soft); border-right: 1px solid var(--gold-soft); }
.bl { bottom: 18px; left: 18px; border-bottom: 1px solid var(--gold-soft); border-left: 1px solid var(--gold-soft); }
.br { bottom: 18px; right: 18px; border-bottom: 1px solid var(--gold-soft); border-right: 1px solid var(--gold-soft); }

/* LAYOUT */
.wrap {
  text-align: center;
  max-width: 600px;
  width: 100%;
}

/* TYPE */
.eyebrow {
  font-size: 10px;
  letter-spacing: 0.42em;
  color: var(--gold);
  margin-bottom: 2rem;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: 46px;
  letter-spacing: 0.12em;
  color: var(--ivory);
}

.sub {
  font-size: 9px;
  letter-spacing: 0.35em;
  color: var(--gold);
  margin: 0.5rem 0 2.5rem;
}

.divider {
  width: 50px;
  height: 1px;
  background: var(--gold-soft);
  margin: 0 auto 2.5rem;
}

.headline {
  font-size: 10px;
  letter-spacing: 0.35em;
  color: var(--gold);
  margin-bottom: 1rem;
}

.body-text {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 20px;
  color: var(--ivory-soft);
  margin-bottom: 2.5rem;
}

/* INPUT */
input {
  width: 100%;
  max-width: 360px;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--gold);
  color: var(--ivory);
  text-align: center;
  padding: 12px 0;
  letter-spacing: 0.18em;
  outline: none;
}

input::placeholder {
  color: var(--muted);
}

/* BUTTON */
.btn {
  margin-top: 1.2rem;
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--gold);
  padding: 14px 42px;
  letter-spacing: 0.4em;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  background: var(--gold);
  color: var(--bg);
}

/* REQUEST LINK */
.request-link {
  margin-top: 2rem;
  font-size: 10px;
  letter-spacing: 0.3em;
  color: var(--gold);
  border-bottom: 1px solid var(--gold-faint);
  padding-bottom: 6px;
  cursor: pointer;
  transition: 0.3s;
}

.request-link:hover {
  color: var(--ivory);
  border-color: var(--gold);
}

/* SCREENS */
.screen { display: none; }
.screen.active { display: block; }

.success-text {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 22px;
  color: var(--ivory-soft);
}
</style>
</head>

<body>

<!-- VIDEO -->
<video class="bg-video" autoplay muted loop playsinline>
  <source src="oildrop.mp4" type="video/mp4">
</video>

<div class="bg-overlay"></div>

<!-- CORNERS -->
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="wrap">

  <div class="eyebrow">Maison D'Vue</div>

  <h1>HAIR ELIXIR</h1>

  <div class="sub">30 ml</div>

  <div class="divider"></div>

  <!-- SCREEN 1 -->
  <div class="screen active" id="screen-password">

    <div class="headline">Private access</div>
    <div class="body-text">Enter your code to continue.</div>

    <input id="code" placeholder="Enter your code">

    <button class="btn" onclick="check()">Enter</button>

    <div class="request-link" onclick="show('screen-request')">
      Request an invitation
    </div>

  </div>

  <!-- SCREEN 2 -->
  <div class="screen" id="screen-request">

    <div class="headline">Request an invitation</div>
    <div class="body-text">Leave your details for consideration.</div>

    <input placeholder="Your name"><br>
    <input placeholder="Your email"><br>

    <button class="btn">Submit</button>

  </div>

  <!-- SUCCESS -->
  <div class="screen" id="screen-success">

    <div class="success-text">
      Your request has been received.
    </div>

  </div>

</div>

<script>
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function check(){
  if(document.getElementById('code').value === "WELCOME26"){
    show('screen-success');
  }
}
</script>

</body>
</html>
